<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#fff; --surface2:#f0eee8; --line:#e2dfd6; --ink:#1c1b18; --muted:#6b675e;
  --accent:#3b4bd8; --accent-soft:#e9ebfb; --good:#1f7a4d; --good-soft:#e4f3ea; --bad:#b4442c; --bad-soft:#f9e8e2;
  --mk:#d9d5ca; --mk2:#bdb8aa;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15151a; --surface:#1e1e25; --surface2:#272730; --line:#34343f; --ink:#ececf1; --muted:#9a9aa8;
    --accent:#8f9bff; --accent-soft:#2a2d4d; --good:#5fc995; --good-soft:#1d3329; --bad:#f08a6c; --bad-soft:#3a2520;
    --mk:#3a3a46; --mk2:#565665;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
kbd{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 5px;background:var(--surface);color:var(--muted)}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
/* left list */
.nav{border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.nav h1{font-size:13px;margin:0 8px 4px;letter-spacing:.02em}
.nav .prog{margin:0 8px 14px;font-size:12px;color:var(--muted)}
.nav .track{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.nav .track i{display:block;height:100%;background:var(--accent);transition:width .2s}
.nav button{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;align-items:start}
.nav button:hover{background:var(--surface2)}
.nav button.cur{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.nav .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--mk2);margin-top:3px;display:grid;place-items:center;font-size:10px;color:#fff}
.nav .done .dot{background:var(--accent);border-color:var(--accent)}
.nav .defer .dot{background:var(--mk2);border-color:var(--mk2)}
.nav .t{font-size:13.5px;line-height:1.35}
.nav .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nav .done .a{color:var(--accent)}
.nav hr{border:0;border-top:1px solid var(--line);margin:10px 8px}

/* main */
.main{display:flex;flex-direction:column;min-height:100vh}
.stage{flex:1;padding:36px 40px 24px;max-width:1080px;width:100%;margin:0 auto}
.kicker{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px}
.tag{background:var(--accent-soft);color:var(--accent);font-weight:600;padding:2px 8px;border-radius:99px}
.tag.hard{background:var(--bad-soft);color:var(--bad)}
h2{font-size:26px;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.ctx{color:var(--muted);margin:0 0 6px;max-width:68ch}
.ctx code{font:12.5px ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
details.more{margin:0 0 4px;color:var(--muted);font-size:13.5px}
details.more summary{cursor:pointer;width:max-content}
details.more p{margin:6px 0 0;max-width:68ch}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.facts span{font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px}
.facts b{font-variant-numeric:tabular-nums}
.pattern{margin-top:28px;padding:10px 12px;border:1px dashed var(--mk2);border-radius:8px;font-size:12.5px;color:var(--muted)}
.pattern b{color:var(--ink)}

/* option cards: rows line up so differences read across */
.opts{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:14px;margin-top:22px}
.opt{display:grid;grid-row:span var(--rows);grid-template-rows:subgrid;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 14px 12px;cursor:pointer;position:relative;outline:0;transition:border-color .12s, box-shadow .12s}
.opt:hover{border-color:var(--mk2)}
.opt:focus-visible,.pvopt:focus-visible,.item:focus-visible,button:focus-visible,h2:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2:focus:not(:focus-visible){outline:0}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt-h{display:flex;gap:8px;align-items:center;padding-bottom:10px}
.opt-h b{font-size:16px;line-height:1.3;flex:1}
.rec{font-size:11px;font-weight:700;color:var(--good);background:var(--good-soft);padding:2px 7px;border-radius:99px;white-space:nowrap}
.check{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:none;place-items:center;font-size:13px}
.opt.sel .check{display:grid}
/* the thing being shown sits in a window frame on a different background, so it reads apart from the decision text */
.opt-v{background:var(--surface2);margin:0 -14px 2px;padding:14px 14px 10px;border-block:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.opt-v + .dim{border-top:0}
.win{border:1px solid var(--mk2);border-radius:8px;overflow:hidden;background:var(--surface);box-shadow:0 3px 10px rgb(0 0 0/.10)}
.win-bar{display:flex;gap:4px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.win-bar i{width:7px;height:7px;border-radius:50%;background:var(--mk2)}
.win-bar span{margin-left:6px;font-size:10.5px;color:var(--muted)}
.win .mk{border-radius:0;background:var(--surface)}
.win .mk-card,.win .mk-split .l div,.win .mk-split .r{background:var(--surface2)}
.win .mk-split .r .blk{background:var(--mk)}
.opt-v .mx-wrap,.opt-v .pipe{background:none;padding:4px}
.cap{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.dim{border-top:1px solid var(--line);padding:8px 0;display:grid;grid-template-columns:14px 1fr;column-gap:6px;align-content:start}
.dim .dk{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.dim .mark{font-weight:700;color:var(--mk2)}
.dim .dv{font-size:14px;line-height:1.35}
.dim.good .mark,.dim.good .dv{color:var(--good)}
.dim.bad .mark,.dim.bad .dv{color:var(--bad)}
.dim.good .dv,.dim.bad .dv{font-weight:600}
.when{border-top:1px solid var(--line);padding-top:9px;font-size:12.5px;color:var(--muted)}
.same{margin-top:12px;font-size:12.5px;color:var(--muted)}

/* small screen drawings (mockups) */
.mk{aspect-ratio:16/10;background:var(--surface2);border-radius:8px;padding:9px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.mk i,.mk u{display:block;background:var(--mk);border-radius:3px;height:6px;text-decoration:none}
.mk .s{width:55%}
.mk-top{display:flex;justify-content:space-between;margin-bottom:2px}
.mk-top i:first-child{width:32%;background:var(--mk2)}
.mk-top i:last-child{width:14%;background:var(--accent);opacity:.7}
.mk-tr{display:grid;grid-template-columns:1.6fr 1fr 1fr .6fr;gap:6px;padding:4px 0;border-top:1px solid var(--mk)}
.mk-tr.h i{background:var(--mk2);height:4px}
.mk-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1}
.mk-card{background:var(--surface);border-radius:5px;padding:6px;display:flex;flex-direction:column;gap:4px}
.mk-card u{width:14px;height:14px;border-radius:50%;background:var(--mk2)}
.mk-split{display:grid;grid-template-columns:1fr 1.5fr;gap:6px;flex:1;min-height:0}
.mk-split .l{display:flex;flex-direction:column;gap:4px}
.mk-split .l div{background:var(--surface);border-radius:4px;padding:5px;display:flex;flex-direction:column;gap:3px}
.mk-split .l div.on{box-shadow:inset 2px 0 0 var(--accent)}
.mk-split .r{background:var(--surface);border-radius:5px;padding:8px;display:flex;flex-direction:column;gap:5px}
.mk-split .r u{width:22px;height:22px;border-radius:50%;background:var(--mk2)}
.mk-split .r .blk{flex:1;background:var(--surface2);border-radius:4px}
.mk-form{justify-content:center;gap:7px;padding:14px 18px}
.mk-form .inp{height:20px;border:1px solid var(--mk2);border-radius:5px;background:var(--surface)}
.mk-btn{align-self:stretch;text-align:center;background:var(--accent);color:var(--surface);font-weight:700;font-size:13.5px;border-radius:6px;padding:7px 8px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-wrap{aspect-ratio:16/10;background:var(--surface2);border-radius:8px;display:grid;place-items:center;padding:12px}
.mx{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:var(--g,3px);width:100%}
.mx i{aspect-ratio:1;background:var(--mk2);border-radius:2px}
.mx i.x{background:var(--bad)}
.mx.big{width:70%}
.mx.big i{aspect-ratio:2/1;border-radius:5px}
.pipe{min-height:96px;background:var(--surface2);border-radius:8px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:6px 0;padding:8px}
.pipe span{font-size:11.5px;font-weight:600;border:1.5px solid var(--mk2);color:var(--muted);border-radius:6px;padding:5px 6px;white-space:nowrap;background:var(--surface)}
.pipe .st{display:flex;align-items:center;font-weight:inherit}
.pipe em{width:18px;height:2px;background:var(--mk2)}
.pipe span.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pipe em.on{background:var(--accent)}
.pipe span.stop{border-style:dashed}

/* one big preview + option switching */
.pvwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;margin-top:22px;align-items:start}
.pvframe{display:none;width:100%;border:0;background:#fff;pointer-events:none}
.pvframe.on{display:block}
.pvopts{display:flex;flex-direction:column;gap:10px}
.pvopt{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;outline:0}
.pvopt:hover{border-color:var(--mk2)}
.pvopt.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pvopt .sw{width:34px;height:34px;border-radius:9px;grid-row:span 2}
.pvopt b{font-size:15px}
.pvopt .line{grid-column:2/-1;font-size:12.5px;color:var(--muted)}
.pvopt .line em{font-style:normal;font-weight:600}
.pvopt .line em.good{color:var(--good)} .pvopt .line em.bad{color:var(--bad)}

/* pick several */
.meter{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.meter .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.meter .top b{font-size:16px;font-variant-numeric:tabular-nums}
.meter .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);transition:width .15s}
.meter.over .bar i{background:var(--bad)} .meter.over .top b{color:var(--bad)}
.items{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item{display:grid;grid-template-columns:22px 1fr 120px 44px;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;outline:0}
.item.sel{border-color:var(--accent)}
/* a recommended item or value laid out ahead of time, not chosen yet */
.item.draft{border-style:dashed;border-color:var(--accent)}
.item.draft .box{border-color:var(--accent);color:var(--accent)}
.draft-note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding:9px 12px;border:1px dashed var(--accent);border-radius:10px;background:var(--accent-soft);font-size:13px}
.draft-note .ghost{padding:5px 11px;font-weight:600;color:var(--accent);border-color:var(--accent)}
.now .draft-b{font-size:12px;font-weight:600;color:var(--accent);border:1px dashed var(--accent);border-radius:99px;padding:1px 8px;margin-left:10px;vertical-align:middle;letter-spacing:0}
.val.draft .now span:first-child{color:var(--muted)}
.item .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--mk2);display:grid;place-items:center;color:#fff;font-size:12px}
.item.sel .box{background:var(--accent);border-color:var(--accent)}
.item b{font-size:15px} .item small{display:block;color:var(--muted);font-size:12.5px}
.item .cost{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.item .cost i{display:block;height:100%;background:var(--mk2)}
.item.sel .cost i{background:var(--accent)}
.item .d{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* small decision batch */
.batch-top{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
.ghost:hover{border-color:var(--mk2)}
.rows{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:14px;padding:12px 14px;align-items:center}
.row+.row{border-top:1px solid var(--line)}
.row .q{font-weight:600;font-size:14.5px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;text-align:left;cursor:pointer;line-height:1.3}
.seg button:hover{border-color:var(--mk2)}
.seg button.sel{border-color:var(--accent);background:var(--accent-soft)}
.seg b{font-size:13.5px;display:flex;gap:6px;align-items:center}
.seg small{color:var(--muted);font-size:12px}
.seg .r{font-size:10.5px;color:var(--good);font-weight:700}

/* pick a value */
.val{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.val .now{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.val .now small{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
.val input[type=range]{width:100%;margin:12px 0 6px;accent-color:var(--accent)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer}
.presets button.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.presets button.draft{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.outs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.out{background:var(--surface2);border-radius:10px;padding:10px 12px}
.out span{font-size:12px;color:var(--muted);display:block}
.out b{font-size:17px}
.out.good b{color:var(--good)} .out.bad b{color:var(--bad)}
.out .viz{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.out .viz i{display:block;height:100%;background:currentColor;opacity:.6}

/* review screen */
.sum{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum button{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;width:100%;text-align:left;border:0;background:none;padding:11px 14px;cursor:pointer}
.sum button+button{border-top:1px solid var(--line)}
.sum button:hover{background:var(--surface2)}
.sum .sq{color:var(--muted);font-size:13.5px}
.sum .sa{font-weight:600}
.sum .sa.none{color:var(--bad);font-weight:500}
.sum .sn{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.go{margin-top:16px;display:flex;gap:12px;align-items:center}
.primary{background:var(--accent);color:var(--surface);border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}
.primary:disabled{opacity:.4;cursor:not-allowed}
.vimg{display:block;width:100%}
.vframe{display:block;width:100%;border:0;background:#fff;pointer-events:none}
.err{margin:40px;color:var(--bad)}
pre{background:var(--surface2);border-radius:10px;padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace;overflow:auto;max-height:260px}

/* bottom bar */
.bar{position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:10px 40px;display:flex;gap:10px;align-items:center}
.txt{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;outline:0}
.txt:focus{border-color:var(--accent)}
.extra{margin-top:22px;display:grid;gap:12px}
.fld{display:grid;gap:5px}
.fld span{font-size:13px;font-weight:600}
/* own answer under the options of a pick question */
.own{margin-top:12px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.own.sel{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.own .txt{margin-top:6px}
.cant{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cant-t{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;font-size:13px;text-align:left}
.cant-t i{font-style:normal;color:var(--muted)}
.cant.open{padding-bottom:12px}
.cant p{margin:0 12px 8px;font-size:12.5px;color:var(--muted)}
.reasons{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;margin:0 12px}
.cant .must{margin:0 12px 8px;font-size:12.5px;color:var(--bad)}
.cant .txt{margin:8px 12px 0;width:calc(100% - 24px)}
.bar .defer.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.bar-in{position:relative}
.reason{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;cursor:pointer;line-height:1.35}
.reason:hover{border-color:var(--mk2)}
.reason.sel{border-color:var(--accent);background:var(--accent-soft)}
.reason b{display:block;font-size:14px}
.reason small{font-size:12.5px;color:var(--muted)}
.dim-all{opacity:.4}
.keys{font-size:12px;color:var(--muted);white-space:nowrap}
.nav .nav-cancel{display:block;width:auto;margin:6px 8px 0;padding:6px 8px;font-size:12.5px;color:var(--muted)}
.nav .nav-cancel:hover{color:var(--bad);background:var(--bad-soft)}
.banner{position:sticky;top:0;z-index:5;background:var(--bad-soft);color:var(--bad);border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px;text-align:center}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .nav .list{display:flex;gap:4px;overflow-x:auto}
  .nav .list{scrollbar-width:none}
  .nav .list button{flex:0 0 auto;width:auto;max-width:190px}
  .nav .list .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav hr{display:none}
  .stage{padding:22px 16px}
  .bar-in{padding:10px 16px;flex-wrap:wrap}
  .keys{display:none}
  .reasons{grid-template-columns:1fr}
  .bar .sp{display:none}
  .bar-in{justify-content:space-between}
  .opts{grid-template-columns:1fr;row-gap:0}
  .opt{margin-bottom:14px}
  .pvwrap{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .seg{grid-auto-flow:row}
  .item{grid-template-columns:22px 1fr 44px}
  .item .cost{display:none}
  .outs{grid-template-columns:1fr}
  h2{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav"></nav>
  <main class="main">
    <div class="banner" id="banner" role="alert" hidden></div>
    <div class="stage" id="stage"></div>
    <div class="bar"><div class="bar-in" id="bar"></div></div>
  </main>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script>
/* Questions come from the server (/api/questions, with the UI strings for the chosen language); answers go to /api/submit.
   /api/live is held open while the page is open, so the server can tell when the tab is gone. */
const rep=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let META={}, D=[], S={}, KEY='vd', cur=0, sent=null, ended=null, panel=null, live=null;
const T=(k,v)=>String((META.strings&&META.strings[k])??k).replace(/\{(\w+)\}/g,(m,n)=>v&&n in v?v[n]:m);
const REASON_KEYS=['info','options','delegate'];
const reasonsFor=d=>d.noDelegate?REASON_KEYS.filter(k=>k!=='delegate'):REASON_KEYS;
const reasonTitle=k=>T('reason.'+k+'.title'), reasonDesc=k=>T('reason.'+k+'.desc');
const locked=()=>!!(sent||ended);
function announce(msg){ const el=document.getElementById('live'); el.textContent=''; setTimeout(()=>{ el.textContent=msg; },30); }

const win=h=>`<div class="win"><div class="win-bar" aria-hidden="true"><i></i><i></i><i></i><span>${T('win.preview')}</span></div>${h}</div>`;
const mkTop='<div class="mk-top"><i></i><i></i></div>';
const SCREENS={
  table:`<div class="mk">${mkTop}<div class="mk-tr h"><i></i><i></i><i></i><i></i></div>${rep(6,()=>'<div class="mk-tr"><i></i><i></i><i></i><i></i></div>')}</div>`,
  cards:`<div class="mk">${mkTop}<div class="mk-cards">${rep(6,()=>'<div class="mk-card"><u></u><i></i><i class="s"></i></div>')}</div></div>`,
  split:`<div class="mk">${mkTop}<div class="mk-split"><div class="l">${rep(4,i=>`<div class="${i==0?'on':''}"><i></i><i class="s"></i></div>`)}</div><div class="r"><u></u><i></i><i class="s"></i><div class="blk"></div></div></div></div>`,
};
// The picture attached to an option. Screens go in a window frame; diagrams do not.
function visual(v){
  if(!v) return '';
  const framed=h=>v.screen===false?h:win(h);
  if(v.type==='screen') return win(SCREENS[v.layout]||SCREENS.table);
  if(v.type==='button') return win(`<div class="mk mk-form"><i style="width:40%;background:var(--mk2)"></i><div class="inp"></div><div class="inp"></div><span class="mk-btn">${esc(v.text)}</span></div>`);
  if(v.type==='grid') return `<div class="mx-wrap"><div class="mx ${v.big?'big':''}" style="--c:${+v.cols};${v.cols>20?'--g:1.5px':''}">${rep(v.cols*(v.rows||1),i=>`<i class="${(v.mark||[]).includes(i)?'x':''}"></i>`)}</div></div>`;
  // Each step keeps its incoming line, so a wrapped flow never leaves a line dangling at the end of a row.
  if(v.type==='steps') return `<div class="pipe">${v.steps.map((x,i)=>`<b class="st">${i?`<em class="${i<=v.reach?'on':''}"></em>`:''}<span class="${i<=v.reach?'on':'stop'}">${esc(x)}</span></b>`).join('')}</div>`;
  if(v.type==='image') return framed(`<img class="vimg" src="/file?path=${encodeURIComponent(v.src)}" alt="">`);
  // allow-same-origin only lets this page measure the drawing (fitFrame); scripts inside still never run.
  if(v.type==='html') return framed(`<iframe class="vframe" sandbox="allow-same-origin" srcdoc="${esc(v.html)}" data-min="${+v.height||0}" style="height:${+v.height||180}px" tabindex="-1" aria-hidden="true"></iframe>`);
  return '';
}
// The preview of a "preview" decision runs in its own sandboxed frame (no scripts, no access to this page), one frame per option.
const PV_CSS=`*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#1c1b18;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
.pv{padding:26px 26px 20px}.pv-badge{display:inline-block;font-size:11.5px;font-weight:700;color:var(--pv);border:1.5px solid var(--pv);border-radius:99px;padding:1px 8px}
.pv h3{font-size:22px;line-height:1.3;margin:10px 0 6px}.pv p{margin:0 0 14px;color:#5d5a52;font-size:14px}.pv a{color:var(--pv);text-decoration:underline}
.pv-btn{display:inline-block;background:var(--pv);color:#fff;font-weight:700;border-radius:8px;padding:9px 16px;font-size:14px}
.pv-chart{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:20px;border-top:1px solid #eceae4;padding-top:12px}
.pv-chart i{flex:1;background:var(--pv);border-radius:3px 3px 0 0;opacity:.85}.pv-chart i:nth-child(odd){opacity:.35}`;
const builtinPreview=()=>`<span class="pv-badge">${esc(T('pv.badge'))}</span><h3>${esc(T('pv.title'))}</h3><p>${esc(T('pv.body'))}<a>${esc(T('pv.link'))}</a></p><span class="pv-btn">${esc(T('pv.button'))}</span><div class="pv-chart">${[40,62,35,80,55,92,70,48].map(h=>`<i style="height:${h}%"></i>`).join('')}</div>`;
const vars=o=>Object.entries(o.vars||{'--pv':o.color||'#3b4bd8'});
const pvDoc=(d,o)=>`<!doctype html><meta charset="utf-8"><style>${PV_CSS}:root{${vars(o).map(v=>v.join(':')).join(';')}}</style><div class="pv">${(d.preview&&d.preview.html)||builtinPreview()}</div>`;

// Saved answers carry the hash of the question file they belong to, so answers for another version never come back.
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify({hash:META.hash,S})); }catch(e){} };
const A=id=>S[id]||(S[id]={});
const recOf=list=>list.find(o=>o.rec)||list[0];
const recItems=d=>d.items.filter(i=>i.rec).map(i=>i.id);
// multi and value questions show the recommendation ahead of time. Until the person acts on it, it is a draft, not an answer.
function isDraft(d){ const a=S[d.id]||{}; if(a.defer) return false;
  if(d.type==='multi') return !a.choices;
  if(d.type==='value') return a.choice==null;
  return false; }
const multiSel=d=>{ const a=S[d.id]; return a&&a.choices?a.choices:recItems(d); };
const stopIdx=d=>{ const a=S[d.id]; const i=a&&a.choice!=null?d.stops.findIndex(s=>s.v===a.choice):-1; return i>=0?i:d.stops.indexOf(recOf(d.stops)); };
function commitDraft(d){ if(!d||!isDraft(d)) return false; const a=A(d.id);
  if(d.type==='multi') a.choices=recItems(d);
  if(d.type==='value') a.choice=d.stops[stopIdx(d)].v;
  save(); return true; }

function isDone(d){ const a=S[d.id]; if(!a) return false; if(a.defer) return true;
  if(d.type==='batch') return d.items.every(i=>a.choices&&a.choices[i.id]);
  if(d.type==='multi') return !!a.choices;
  if(d.type==='pick'&&a.own) return true;
  return a.choice!=null; }
function answerText(d){ const a=S[d.id]; if(!a) return ''; if(a.defer) return T('ans.sentBack',{reason:reasonTitle(a.defer)});
  if(d.type==='pick'&&a.own) return T('ans.own',{x:a.own});
  if(d.type==='pick'||d.type==='preview'){ const o=d.options.find(o=>o.key===a.choice); return o?o.label:''; }
  if(d.type==='multi') return a.choices? d.items.filter(i=>a.choices.includes(i.id)).map(i=>i.label).join(', ')||T('ans.nothing') : '';
  if(d.type==='batch') return isDone(d)? d.items.map(i=>i.options.find(o=>o.key===a.choices[i.id])?.label??'').join(' · ') : (a.choices?T('ans.chosen',{n:Object.keys(a.choices).length,m:d.items.length}):'');
  if(d.type==='value') return a.choice!=null? a.choice+(d.unit||'') : '';
  return ''; }
const doneCount=()=>D.filter(isDone).length;
function contrast(hex){ if(!/^#[0-9a-f]{6}$/i.test(hex||'')) return null; const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4); return 1.05/(.2126*c[0]+.7152*c[1]+.0722*c[2]+.05); }

function renderNav(){
  const n=doneCount();
  document.getElementById('nav').innerHTML=`<h1>${esc(META.title||T('nav.title'))} · ${D.length}</h1>
    <div class="prog">${T('nav.progress',{n,m:D.length})}<div class="track" aria-hidden="true"><i style="width:${n/D.length*100}%"></i></div></div>
    <div class="list">${D.map((d,i)=>{ const a=S[d.id]||{}; const done=isDone(d); const cls=a.defer?'defer':done?'done':'';
      const sub=answerText(d)||(isDraft(d)?T('nav.draft'):'')||d.tag||'';
      return `<button data-go="${i}" class="${cls} ${i===cur?'cur':''}" ${i===cur?'aria-current="step"':''}><span class="dot" aria-hidden="true">${a.defer?'↩':done?'✓':''}</span><span><span class="t">${esc(d.short||d.q)}</span><span class="a">${esc(sub)}</span>${done?'':`<span class="sr">, ${T('sr.open')}</span>`}</span></button>`; }).join('')}
    <hr><button data-go="${D.length}" class="${cur===D.length?'cur':''}" ${cur===D.length?'aria-current="step"':''}><span class="dot" style="border-style:dashed" aria-hidden="true"></span><span><span class="t">${T('nav.review')}</span><span class="a">${n===D.length?T('nav.all'):T('nav.left',{n:D.length-n})}</span></span></button></div>
    ${locked()?'':`<button class="nav-cancel" data-cancel>${T('nav.cancel')}</button>`}`;
  // On a phone the list scrolls sideways and is redrawn on every change: keep where it was, and bring the current question into view.
  const l=document.querySelector('#nav .list'), c=l.querySelector('.cur');
  l.scrollLeft=navScroll;
  if(c&&l.scrollWidth>l.clientWidth){ const x=c.getBoundingClientRect().left-l.getBoundingClientRect().left+l.scrollLeft; if(x<l.scrollLeft||x+c.offsetWidth>l.scrollLeft+l.clientWidth) l.scrollLeft=x-16; }
  navScroll=l.scrollLeft;
}
let navScroll=0;
document.addEventListener('scroll',e=>{ if(e.target.classList&&e.target.classList.contains('list')) navScroll=e.target.scrollLeft; },true);
function head(d){
  return `<div class="kicker">${d.tag?`<span class="tag">${esc(d.tag)}</span>`:''}${d.noDelegate?`<span class="tag hard">${T('head.noDelegate')}</span>`:''}<span>${cur+1} / ${D.length}</span></div>
  <h2 id="qh" tabindex="-1">${esc(d.q)}</h2>${d.ctx?`<p class="ctx">${esc(d.ctx)}</p>`:''}
  ${d.more?`<details class="more"><summary>${T('head.more')}</summary><p>${esc(d.more)}</p></details>`:''}
  ${d.facts?`<div class="facts">${d.facts.map(f=>`<span>${esc(f[0])} <b>${esc(f[1])}</b></span>`).join('')}</div>`:''}`;
}
const mark=t=>t==='good'?'＋':t==='bad'?'－':'·';
const recBadge=()=>`<span class="rec">${T('pick.rec')}</span>`;
// Only the chosen radio (or the first one) is in the tab order; arrow keys move within the group.
const tabFor=(key,list,chosen)=>key===(chosen!=null&&list.some(o=>o.key===chosen)?chosen:list[0].key)?0:-1;
const stopsHtml=(d,i,draft)=>d.stops.filter(s=>s.label).map(s=>{ const on=d.stops[i]===s; return `<button class="${on?(draft?'draft':'sel'):''}" aria-pressed="${on&&!draft}" data-stop="${d.stops.indexOf(s)}">${esc(s.label)} ${esc(s.v)}</button>`; }).join('');
const outsHtml=(d,i)=>(d.stops[i].outs||[]).map(o=>`<div class="out ${o.t||''}"><span>${esc(o.k)}</span><b>${esc(o.v)}</b>${o.p!=null?`<div class="viz" aria-hidden="true"><i style="width:${o.p}%"></i></div>`:''}</div>`).join('');
const valueText=(d,i)=>`${d.stops[i].v}${d.unit||''}${d.stops[i].label?' · '+d.stops[i].label:''}`.trim();
// A pick question takes a typed answer of the person's own unless it says "ownAnswer": false.
const ownOk=d=>d.type==='pick'&&d.ownAnswer!==false;
const draftNote=(kind)=>`<div class="draft-note" id="draftnote"><span>${T('draft.'+kind)}</span><button class="ghost" data-confirm>${T('draft.confirm')}</button></div>`;

function body(d){
  const a=S[d.id]||{};
  if(d.type==='pick'){ const dims=d.dims||[]; return `<div class="opts" role="radiogroup" aria-labelledby="qh" style="--n:${d.options.length};--rows:${dims.length+3}">
    ${d.options.map((o,i)=>`<div class="opt ${a.choice===o.key?'sel':''}" role="radio" aria-checked="${a.choice===o.key}" tabindex="${tabFor(o.key,d.options,a.choice)}" data-pick="${esc(o.key)}" aria-label="${esc(o.label)}${o.rec?' ('+esc(T('pick.rec'))+')':''}">
      <span class="check" aria-hidden="true">✓</span>
      <div class="opt-h"><kbd aria-hidden="true">${i+1}</kbd><b>${esc(o.label)}</b>${o.rec?recBadge():''}</div>
      <div class="opt-v">${visual(o.visual)}${o.cap?`<div class="cap">${esc(o.cap)}</div>`:''}</div>
      ${dims.map((k,j)=>{ const c=(o.d||[])[j]||['','']; return `<div class="dim ${c[1]||''}"><span class="dk">${esc(k)}</span><span class="mark" aria-hidden="true">${mark(c[1])}</span><span class="dv">${esc(c[0])}</span></div>`; }).join('')}
      <div class="when">${esc(o.when)}</div></div>`).join('')}
    </div>${d.same?`<div class="same">${esc(d.same)}</div>`:''}${ownOk(d)?`<label class="own fld ${a.own?'sel':''}" id="ownbox"><span>${T('own.label')}</span><input class="txt" id="own" placeholder="${esc(T('own.ph'))}" value="${esc(a.own||'')}"></label>`:''}`; }

  if(d.type==='preview'){ const shown=(d.options.find(o=>o.key===a.choice)||recOf(d.options)).key; const h=+(d.preview&&d.preview.height)||320;
    return `<div class="pvwrap">${win(d.options.map(o=>`<iframe class="pvframe ${o.key===shown?'on':''}" data-pv="${esc(o.key)}" sandbox srcdoc="${esc(pvDoc(d,o))}" style="height:${h}px" tabindex="-1" aria-hidden="true"></iframe>`).join(''))}
      <div class="pvopts" role="radiogroup" aria-labelledby="qh">${d.options.map((o,i)=>{ const c=contrast(o.color); return `<div class="pvopt ${a.choice===o.key?'sel':''}" role="radio" aria-checked="${a.choice===o.key}" tabindex="${tabFor(o.key,d.options,a.choice)}" data-pick="${esc(o.key)}" data-hover="${esc(o.key)}">
        <span class="sw" style="background:${esc(o.color||'var(--mk)')}" aria-hidden="true"></span><b>${esc(o.label)} ${o.rec?recBadge():''}</b><kbd aria-hidden="true">${i+1}</kbd>
        <span class="line">${esc(o.desc)}${c?` · ${T('prev.contrast')} <em class="${c>=4.5?'good':'bad'}">${c.toFixed(1)} : 1 ${c>=4.5?T('prev.ok'):T('prev.bad')}</em>`:''}</span></div>`; }).join('')}</div></div>`; }

  if(d.type==='multi'){ const draft=isDraft(d); const sel=multiSel(d); const total=d.items.filter(i=>sel.includes(i.id)).reduce((s,i)=>s+(i.cost||0),0); const u=esc(d.unit||''); const over=d.budget!=null&&total>d.budget; const mx=Math.max(...d.items.map(i=>i.cost||0))||1;
    const diff=d.budget==null?'':over?T('multi.over',{x:+(total-d.budget).toFixed(1),u}):total<d.budget?T('multi.left',{x:+(d.budget-total).toFixed(1),u}):T('multi.exact');
    return `${d.budget!=null?`<div class="meter ${over?'over':''}"><div class="top"><span>${draft?T('multi.draftSel',{n:sel.length}):T('multi.selected',{n:sel.length})}</span><span><b>${total}${u}</b> / ${d.budget}${u} · ${diff}</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${Math.min(100,total/d.budget*100)}%"></i></div></div>`:''}
      ${draft?draftNote('multi'):''}
      <div class="items" role="group" aria-labelledby="qh">${d.items.map(i=>{ const on=sel.includes(i.id); const cls=on?(draft?'draft':'sel'):''; return `<div class="item ${cls}" role="checkbox" aria-checked="${on&&!draft}" tabindex="0" data-toggle="${esc(i.id)}">
        <span class="box" aria-hidden="true">${on?'✓':''}</span><span><b>${esc(i.label)}</b> ${i.rec?recBadge():''}<small>${esc(i.sub)}</small></span>
        <span class="cost" aria-hidden="true">${i.cost!=null?`<i style="width:${i.cost/mx*100}%"></i>`:''}</span><span class="d">${i.cost!=null?i.cost+u:''}</span></div>`; }).join('')}</div>`; }

  if(d.type==='batch'){ const ch=a.choices||{};
    return `<div class="batch-top"><span class="same" style="margin:0">${T('batch.chosen',{n:Object.keys(ch).length,m:d.items.length})}</span><button class="ghost" data-allrec>${T('batch.allrec')}</button></div>
      <div class="rows">${d.items.map(i=>`<div class="row"><span class="q" id="bq-${esc(i.id)}">${esc(i.q)}</span><div class="seg" role="radiogroup" aria-labelledby="bq-${esc(i.id)}">${i.options.map(o=>`<button role="radio" aria-checked="${ch[i.id]===o.key}" tabindex="${tabFor(o.key,i.options,ch[i.id])}" class="${ch[i.id]===o.key?'sel':''}" data-seg="${esc(i.id)}" data-key="${esc(o.key)}"><b>${esc(o.label)}${o.rec?`<span class="r">${T('pick.rec')}</span>`:''}</b><small>${esc(o.sub)}</small></button>`).join('')}</div></div>`).join('')}</div>`; }

  if(d.type==='value'){ const i=stopIdx(d); const draft=isDraft(d);
    return `<div class="val ${draft?'draft':''}" id="val"><div class="now"><span id="vnow">${esc(d.stops[i].v)}</span><small>${esc(d.unit)}</small>${draft?`<span class="draft-b" id="vdraft">${T('draft.badge')}</span>`:''}</div>
      <input type="range" id="vrange" min="0" max="${d.stops.length-1}" step="1" value="${i}" aria-labelledby="qh" aria-valuetext="${esc(valueText(d,i))}">
      <div class="presets" id="vpre">${stopsHtml(d,i,draft)}</div>
      ${draft?draftNote('value'):''}
      <div class="outs" id="vouts">${outsHtml(d,i)}</div></div>`; }
  return '';
}

function summary(){
  const n=doneCount(), all=n===D.length;
  return `<div class="kicker"><span class="tag">${T('sum.tag')}</span></div><h2 id="qh" tabindex="-1">${sent?T('sum.doneTitle'):all?T('sum.allTitle'):T('sum.leftTitle',{n:D.length-n})}</h2>
    <p class="ctx">${sent?T('sum.doneCtx'):T('sum.ctx')}</p>
    ${sent&&sent.path?`<p class="ctx">${T('sum.saved',{path:`<code>${esc(sent.path)}</code>`})}</p>`:''}
    <div class="sum">${D.map((d,i)=>{ const a=S[d.id]||{}; const t=answerText(d);
      return `<button data-go="${i}" ${sent?'disabled':''}><span class="sq">${esc(d.short||d.q)}</span><span class="sa ${isDone(d)?'':'none'}">${isDone(d)?esc(t):T('sum.none')}${a.defer&&a.why?`<span class="sn">${T('sum.reason')}: ${esc(a.why)}</span>`:''}${a.note?`<span class="sn">${T('sum.note')}: ${esc(a.note)}</span>`:''}</span></button>`; }).join('')}</div>
    <div class="go"><button class="primary" data-send ${all&&!sent?'':'disabled'}>${sent?T('sum.submitted'):T('sum.submit')}</button>
      <span class="same" style="margin:0">${sent?'':T('sum.hint')}</span></div>
`;
}
const endView=()=>`<div class="kicker"><span class="tag hard">${T('end.tag')}</span></div><h2 id="qh" tabindex="-1">${T('end.'+ended+'.title')}</h2><p class="ctx">${T('end.ctx')}</p>`;
function extras(d,a){
  const open=panel||a.defer; const keys=reasonsFor(d);
  return `<div class="extra">
    <label class="fld"><span>${T('extra.label')}</span><input class="txt" id="note" placeholder="${esc(T('extra.ph'))}" value="${esc(a.note||'')}"></label>
    <div class="cant ${open?'open':''}">
      <button class="cant-t" data-defer aria-expanded="${!!open}" aria-controls="cantbody">${T('cant.title')} <i aria-hidden="true">${open?'▴':'▾'}</i></button>
      <div id="cantbody">${open?`<p>${T('cant.help')}</p>${d.noDelegate?`<p class="must">${T('cant.noDelegate')}</p>`:''}
        <div class="reasons" style="--n:${keys.length}">${keys.map(k=>`<button class="reason ${a.defer===k?'sel':''}" aria-pressed="${a.defer===k}" data-reason="${k}"><b>${reasonTitle(k)}</b><small>${reasonDesc(k)}</small></button>`).join('')}</div>
        ${a.defer?`<input class="txt" id="dnote" aria-label="${esc(T('cant.ph'))}" placeholder="${esc(T('cant.ph'))}" value="${esc(a.why||'')}">`:''}`:''}</div>
    </div></div>`;
}
const nextLabel=d=>{ const last=cur===D.length-1; return isDraft(d)?T(last?'bar.confirmReview':'bar.confirmNext'):T(last?'bar.review':'bar.next'); };
function renderStage(){
  const st=document.getElementById('stage'), bar=document.getElementById('bar');
  if(ended){ st.innerHTML=endView(); bar.innerHTML=''; return; }
  if(cur>=D.length){ st.innerHTML=summary(); bar.innerHTML=sent?'':`<button class="ghost" data-prev>${T('bar.prev')}</button><span style="flex:1"></span>`; return; }
  const d=D[cur], a=S[d.id]||{};
  st.innerHTML=head(d)+`<div class="${a.defer?'dim-all':''}">${body(d)}</div>`+extras(d,a)+(d.pattern?`<div class="pattern"><b>${T('note.label')}</b> · ${esc(d.pattern)}</div>`:'');
  bar.innerHTML=`<button class="ghost" data-prev ${cur?'':'disabled'}>${T('bar.prev')}</button>
    <span class="keys" style="flex:1;text-align:center" aria-hidden="true">${d.options?'<kbd>1</kbd>~<kbd>'+d.options.length+'</kbd> '+T('key.choose')+' · ':''}<kbd>←</kbd><kbd>→</kbd> ${T('key.move')} · <kbd>⏎</kbd> ${T('key.next')}</span>
    <span class="sp" style="flex:1"></span>
    <button class="primary" data-next>${nextLabel(d)}</button>`;
}
// Re-rendering replaces the elements, so keyboard focus is put back on the matching control.
const FOCUS_KEYS=['pick','toggle','seg','stop','reason','allrec','defer','confirm','next','prev','send','cancel'];
function focusSig(){ const el=document.activeElement; if(!el||el===document.body) return null;
  for(const k of FOCUS_KEYS) if(k in el.dataset) return `[data-${k}="${CSS.escape(el.dataset[k])}"]`+('key' in el.dataset?`[data-key="${CSS.escape(el.dataset.key)}"]`:'');
  return el.id?'#'+CSS.escape(el.id):null; }
function render(){ const sig=focusSig(); renderNav(); renderStage();
  if(sig){ const el=document.querySelector('#stage '+sig+',#bar '+sig+',#nav '+sig); if(el) el.focus({preventScroll:true}); } }
const focusHead=()=>{ const h=document.getElementById('qh'); if(h) h.focus({preventScroll:true}); };

// Moving between questions never settles a draft. Only "Next" (which says so) or touching the draft does.
function go(i){ if(locked()) return; panel=null; cur=Math.max(0,Math.min(D.length,i)); render(); window.scrollTo(0,0); focusHead(); }
function next(){ const d=D[cur]; if(commitDraft(d)) announce(T('sr.picked',{x:answerText(d)})); go(cur+1); }
function pick(key){ const d=D[cur]; const a=A(d.id); a.choice=key; delete a.own; delete a.defer; panel=null; save(); render(); const o=d.options.find(o=>o.key===key); if(o) announce(T('sr.picked',{x:o.label})); }
function setStop(i,moveSlider){ const d=D[cur]; const wasDraft=isDraft(d); const a=A(d.id); a.choice=d.stops[i].v; delete a.defer; save();
  // Updated in place, not re-rendered, so a slider drag is not interrupted.
  document.getElementById('vnow').textContent=d.stops[i].v; document.getElementById('vouts').innerHTML=outsHtml(d,i); document.getElementById('vpre').innerHTML=stopsHtml(d,i,false);
  const r=document.getElementById('vrange'); if(moveSlider) r.value=i; r.setAttribute('aria-valuetext',valueText(d,i));
  if(wasDraft){ ['draftnote','vdraft'].forEach(id=>{ const el=document.getElementById(id); if(el) el.remove(); }); document.getElementById('val').classList.remove('draft'); const nb=document.querySelector('[data-next]'); if(nb) nb.textContent=nextLabel(d); }
  if(moveSlider) announce(T('sr.picked',{x:valueText(d,i)}));
  renderNav(); }
let sending=false;
async function send(){
  if(sending||locked()) return; sending=true;
  const btn=document.querySelector('[data-send]'); if(btn) btn.disabled=true;
  try{ const r=await fetch('/api/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({state:S,hash:META.hash})});
    if(!r.ok) throw new Error(await r.text()); sent=await r.json(); if(live) live.close(); try{ localStorage.removeItem(KEY); }catch(e){} render(); focusHead(); announce(T('sum.doneTitle')); }
  catch(e){ alert(T('err.submit')+'\n'+e.message); if(btn) btn.disabled=false; }
  finally{ sending=false; }
}
async function cancel(){
  if(locked()||!confirm(T('cancel.confirm'))) return;
  try{ const r=await fetch('/api/cancel',{method:'POST'}); if(!r.ok) throw new Error(await r.text()); end('cancelled'); }
  catch(e){ alert(T('err.submit')+'\n'+e.message); }
}
function end(reason){ if(sent||ended) return; ended=reason; if(live) live.close(); banner(false); render(); focusHead(); announce(T('end.'+reason+'.title')); }
function banner(on){ const b=document.getElementById('banner'); b.hidden=!on; b.textContent=on?T('offline'):''; }
// Answers saved in this browser may come from an earlier version of the question file. Keep only those that still match.
function cleanSaved(saved){ const out={}; if(!saved||typeof saved!=='object') return out;
  for(const d of D){ const a=saved[d.id]; if(!a||typeof a!=='object') continue; const c={};
    if(reasonsFor(d).includes(a.defer)){ c.defer=a.defer; if(typeof a.why==='string'&&a.why) c.why=a.why; }
    else if(d.type==='pick'||d.type==='preview'){ if(d.options.some(o=>o.key===a.choice)) c.choice=a.choice; else if(ownOk(d)&&typeof a.own==='string'&&a.own.trim()) c.own=a.own; }
    else if(d.type==='multi'){ if(Array.isArray(a.choices)) c.choices=d.items.map(i=>i.id).filter(id=>a.choices.includes(id)); }
    else if(d.type==='batch'){ if(a.choices&&typeof a.choices==='object'){ c.choices={}; d.items.forEach(i=>{ if(i.options.some(o=>o.key===a.choices[i.id])) c.choices[i.id]=a.choices[i.id]; }); } }
    else if(d.type==='value'){ if(d.stops.some(s=>s.v===a.choice)) c.choice=a.choice; }
    if(typeof a.note==='string'&&a.note) c.note=a.note;
    if(Object.keys(c).length) out[d.id]=c; }
  return out; }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-pick],[data-toggle],[data-seg],[data-allrec],[data-stop],[data-defer],[data-prev],[data-next],[data-send],[data-reason],[data-confirm],[data-cancel]'); if(!t||t.disabled) return;
  if(locked()) return;
  const d=D[cur];
  if(t.dataset.go!=null) go(+t.dataset.go);
  else if(t.dataset.pick) pick(t.dataset.pick);
  else if(t.dataset.toggle){ const a=A(d.id); const s=new Set(multiSel(d)); const on=!s.has(t.dataset.toggle); on?s.add(t.dataset.toggle):s.delete(t.dataset.toggle); a.choices=d.items.map(i=>i.id).filter(x=>s.has(x)); delete a.defer; save(); render();
    const it=d.items.find(i=>i.id===t.dataset.toggle); announce(T(on?'sr.added':'sr.removed',{x:it.label,n:a.choices.length})); }
  else if(t.dataset.seg){ const i=t.dataset.seg, k=t.dataset.key; const a=A(d.id); (a.choices||(a.choices={}))[i]=k; delete a.defer; save(); render(); }
  else if('allrec' in t.dataset){ const a=A(d.id); a.choices={}; d.items.forEach(i=>a.choices[i.id]=recOf(i.options).key); delete a.defer; save(); render(); announce(answerText(d)); }
  else if(t.dataset.stop){ setStop(+t.dataset.stop,true); }
  else if('confirm' in t.dataset){ commitDraft(d); render(); const h=document.getElementById('qh'); if(h) h.focus({preventScroll:true}); announce(T('sr.picked',{x:answerText(d)})); }
  else if(t.dataset.reason){ const a=A(d.id); if(a.defer===t.dataset.reason) delete a.defer; else a.defer=t.dataset.reason; panel=true; save(); render(); const dn=document.getElementById('dnote'); if(dn) dn.focus(); }
  else if('defer' in t.dataset){ const a=A(d.id); if(panel||a.defer){ panel=null; delete a.defer; save(); } else panel=true; render(); }
  else if('prev' in t.dataset){ go(cur-1); }
  else if('next' in t.dataset){ next(); }
  else if('send' in t.dataset){ send(); }
  else if('cancel' in t.dataset){ cancel(); }
});
document.addEventListener('input',e=>{
  if(locked()) return;
  if(e.target.id==='vrange') setStop(+e.target.value);
  if(e.target.id==='dnote'){ const a=A(D[cur].id); a.why=e.target.value; if(!a.why) delete a.why; save(); }
  if(e.target.id==='own'){ const d=D[cur], a=A(d.id); const v=e.target.value.trim(); if(v){ a.own=e.target.value; delete a.choice; delete a.defer; } else delete a.own; save();
    // Updated in place, not re-rendered, so typing is not interrupted.
    document.querySelectorAll('#stage [data-pick]').forEach(o=>{ o.classList.remove('sel'); o.setAttribute('aria-checked','false'); });
    document.getElementById('ownbox').classList.toggle('sel',!!v); renderNav(); }
  if(e.target.id==='note'){ const a=A(D[cur].id); a.note=e.target.value; if(!a.note) delete a.note; save(); }
});
// A drawing's frame grows (or shrinks) to fit what is drawn, so a height that is too small never cuts it off. `height` is the least it gets.
function fitFrame(f){
  try{ const d=f.contentDocument, b=d&&d.body; if(!b) return;
    const need=Math.ceil(b.getBoundingClientRect().bottom+parseFloat(getComputedStyle(b).marginBottom||0));
    const over=d.documentElement.scrollHeight>f.clientHeight?d.documentElement.scrollHeight:0;
    f.style.height=Math.min(Math.max(need,over,+f.dataset.min||0,40),900)+'px'; }catch{}
}
document.addEventListener('load',e=>{ if(e.target.classList&&e.target.classList.contains('vframe')) fitFrame(e.target); },true);
let fitTimer; addEventListener('resize',()=>{ clearTimeout(fitTimer); fitTimer=setTimeout(()=>document.querySelectorAll('.vframe').forEach(fitFrame),150); });
const showPv=key=>document.querySelectorAll('.pvframe').forEach(f=>f.classList.toggle('on',f.dataset.pv===key));
const chosenPv=()=>{ const d=D[cur], a=S[d.id]||{}; return (d.options.find(o=>o.key===a.choice)||recOf(d.options)).key; };
document.addEventListener('mouseover',e=>{ const t=e.target.closest('[data-hover]'); if(t) showPv(t.dataset.hover); });
document.addEventListener('mouseout',e=>{ const t=e.target.closest('[data-hover]'); if(!t||t.contains(e.relatedTarget)) return; showPv(chosenPv()); });
document.addEventListener('keydown',e=>{
  if(locked()) return;
  const inField=e.target.matches('input');
  // Arrow keys inside an option group move between its options (radios also select, as native radios do).
  const grp=!inField&&e.target.closest('[role=radiogroup],[role=group]');
  if(grp&&/^Arrow(Up|Down|Left|Right)$/.test(e.key)){
    const items=[...grp.querySelectorAll('[role=radio],[role=checkbox]')]; const i=items.indexOf(e.target.closest('[role=radio],[role=checkbox]'));
    if(i>=0){ e.preventDefault(); const n=items[(i+(e.key==='ArrowRight'||e.key==='ArrowDown'?1:-1)+items.length)%items.length]; n.focus(); if(n.getAttribute('role')==='radio') n.click(); return; }
  }
  if(e.key==='Enter'&&!e.target.matches('button,summary')){ e.preventDefault(); const r=e.target.closest('[data-pick],[data-toggle]'); if(r&&document.activeElement===r){ r.click(); return; } if(cur<D.length) next(); return; }
  if(e.key===' '&&e.target.matches('div[role]')){ e.preventDefault(); e.target.click(); return; }
  if(inField||e.metaKey||e.ctrlKey||e.altKey) return;
  const d=D[cur];
  if(d&&d.options&&/^[1-9]$/.test(e.key)&&d.options[+e.key-1]) pick(d.options[+e.key-1].key);
  if(e.key==='ArrowRight') go(cur+1);
  if(e.key==='ArrowLeft') go(cur-1);
});
// The open stream tells the server this tab is still here. If the server stops waiting, it says why before it goes.
function connect(){
  if(!window.EventSource) return;
  live=new EventSource('/api/live');
  live.addEventListener('open',()=>banner(false));
  live.addEventListener('end',ev=>{ let r='closed'; try{ r=JSON.parse(ev.data).reason; }catch(e){} end(r); });
  live.addEventListener('error',()=>{ if(!sent&&!ended) banner(true); });
}
fetch('/api/questions').then(r=>r.json()).then(q=>{ META=q; D=q.decisions; KEY='hus-visual-decision:'+q.id; document.title=q.title||T('nav.title'); document.documentElement.lang=q.lang||'en';
  document.getElementById('nav').setAttribute('aria-label',T('nav.title'));
  try{ const saved=JSON.parse(localStorage.getItem(KEY)||'null'); if(saved&&saved.hash===q.hash) S=cleanSaved(saved.S); else if(saved) localStorage.removeItem(KEY); }catch(e){}
  render(); connect(); })
  .catch(e=>{ document.getElementById('stage').innerHTML=`<p class="err">${esc(T("err.load"))}: ${esc(e.message)}</p>`; });
</script>
